<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotuno Spite and Malice</title>
<meta name="description" content="Spite and Malice with Rotuno house rules. Plays in any browser, installs to your phone.">
<meta name="theme-color" content="#0e4a33">

<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotuno Spite">

<style>
  :root {
    --felt: #0e4a33;
    --felt-dark: #0a3626;
    --ink: #b0202a;
    --paper: #fdfcf8;
    --line: rgba(255, 255, 255, 0.16);
    --text: #eef3f0;
    --muted: #a9c3b6;
    /* Cards scale with the viewport so one layout serves phone and desktop. */
    --card-w: clamp(46px, 13vw, 74px);
    --card-h: calc(var(--card-w) * 1.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 0%, var(--felt) 0%, var(--felt-dark) 100%);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  main { max-width: 720px; margin: 0 auto; }

  header { text-align: center; padding: 8px 0 24px; }
  h1 {
    font: 700 clamp(24px, 7vw, 38px)/1.15 Georgia, "Times New Roman", serif;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  .tagline { color: var(--muted); font-size: 14px; margin: 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    min-height: 48px;           /* comfortable tap target on a phone */
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--paper); color: #16241d; border-color: transparent; }
  button:active { transform: translateY(1px); }

  section { margin: 24px 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

  .hand { display: flex; flex-wrap: wrap; gap: 8px; }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    border-radius: calc(var(--card-w) * 0.12);
    background: var(--paper);
    color: #16241d;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: calc(var(--card-w) * 0.09);
    font-weight: 700;
    line-height: 1;
  }
  .card.red { color: var(--ink); }
  .card.wild { outline: 2px solid #d8a53a; outline-offset: -2px; }
  .card .rank { font-size: calc(var(--card-w) * 0.30); }
  .card .suit { font-size: calc(var(--card-w) * 0.34); align-self: flex-end; }
  .card.forced { box-shadow: 0 0 0 3px #d8a53a, 0 2px 6px rgba(0, 0, 0, 0.35); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat { background: rgba(0, 0, 0, 0.2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }

  .note { color: var(--muted); font-size: 13px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 0 8px; }
  a { color: #cfe3d8; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rotuno Spite&nbsp;and&nbsp;Malice</h1>
    <p class="tagline">Kings and Jokers wild · aces and twos compulsory</p>
  </header>

  <div class="actions">
    <button class="primary" id="deal">Deal a hand</button>
    <button id="share">Share</button>
  </div>

  <section id="table" hidden>
    <h2>Your hand</h2>
    <div class="hand" id="hand"></div>
    <p class="note" id="forced"></p>

    <h2 style="margin-top:20px">The deal</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <h2>Status</h2>
    <p class="note" id="status">Rules engine is complete and tested. The playable board is next.</p>
  </section>

  <footer>
    <a href="./tests/">engine tests</a>
  </footer>
</main>

<script type="module">
  import { createGame, forcedPlayIndices } from './src/engine/game.js';
  import { label, isWild } from './src/engine/cards.js';

  const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣', X: '★' };
  const RED = new Set(['H', 'D']);

  function cardEl(card, forced) {
    const el = document.createElement('div');
    el.className = 'card';
    if (RED.has(card.suit)) el.classList.add('red');
    if (isWild(card)) el.classList.add('wild');
    if (forced) el.classList.add('forced');
    const text = label(card);
    el.innerHTML =
      `<span class="rank">${card.rank === 0 ? 'JKR' : text.slice(0, -1)}</span>` +
      `<span class="suit">${SUIT[card.suit] ?? ''}</span>`;
    el.title = text;
    return el;
  }

  function stat(value, caption) {
    return `<div class="stat"><b>${value}</b><span>${caption}</span></div>`;
  }

  function deal() {
    const game = createGame({ players: ['You', 'Opponent'] });
    const you = game.players[0];
    const forced = new Set(forcedPlayIndices(game, you));

    const hand = document.getElementById('hand');
    hand.replaceChildren(...you.hand.map((c, i) => cardEl(c, forced.has(i))));

    document.getElementById('forced').textContent = forced.size
      ? `You must play ${forced.size === 1 ? 'that card' : 'those cards'} before ending your turn.`
      : 'Nothing compulsory in this hand.';

    document.getElementById('stats').innerHTML =
      stat(you.payoff.length, 'your payoff') +
      stat(game.players[1].payoff.length, 'their payoff') +
      stat(game.draw.length, 'draw pile') +
      stat(108, 'cards in play');

    document.getElementById('table').hidden = false;
  }

  document.getElementById('deal').addEventListener('click', deal);

  // The share sheet is the whole point of a web build: one link, and it opens
  // on an iPhone or an Android phone with nothing to install.
  document.getElementById('share').addEventListener('click', async () => {
    const data = { title: 'Rotuno Spite and Malice', text: 'Game of Spite and Malice', url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else {
        await navigator.clipboard.writeText(location.href);
        document.getElementById('status').textContent = 'Link copied to the clipboard.';
      }
    } catch { /* the user dismissed the sheet */ }
  });

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
